<!doctype html>
<html lang="ko">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
<main class="wrap">

</main>
<script src="script.js"></script>
</html>
